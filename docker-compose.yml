version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: grevoro_postgres
    environment:
      POSTGRES_USER: grevoro
      POSTGRES_PASSWORD: grevoro
      POSTGRES_DB: grevoro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grevoro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grevoro_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: grevoro_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: grevoro
      MONGO_INITDB_ROOT_PASSWORD: grevoro
      MONGO_INITDB_DATABASE: grevoro
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/grevoro --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: grevoro_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    container_name: grevoro_ml
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: grevoro_api
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://grevoro:grevoro@postgres:5432/grevoro
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://grevoro:grevoro@mongo:27017/grevoro?authSource=admin
      S3_ENDPOINT: http://minio:9000
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: grevoro_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://grevoro:grevoro@postgres:5432/grevoro
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://grevoro:grevoro@mongo:27017/grevoro?authSource=admin
      S3_ENDPOINT: http://minio:9000
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: grevoro_web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: grevoro_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  minio_data:
